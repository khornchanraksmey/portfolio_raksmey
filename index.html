    <!-- Script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-800 antialiased selection:bg-teal-500/20 selection:text-teal-700 dark:bg-zinc-950 dark:text-zinc-200 dark:selection:bg-teal-400/20 dark:selection:text-teal-300 transition-colors duration-200">
