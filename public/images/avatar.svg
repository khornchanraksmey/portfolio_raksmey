<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="200" height="200" rx="100" fill="url(#avatarGrad)" />
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#grad)" stroke-width="3" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Abstract Data Science / Developer Portrait Silhouette -->
  <!-- Head -->
  <circle cx="100" cy="80" r="36" fill="#334155" />
  <circle cx="100" cy="78" r="34" fill="#475569" />
  
  <!-- Modern glasses / tech styling -->
  <rect x="74" y="74" width="22" height="13" rx="3" fill="none" stroke="#2dd4bf" stroke-width="2.5" />
  <rect x="104" y="74" width="22" height="13" rx="3" fill="none" stroke="#2dd4bf" stroke-width="2.5" />
  <line x1="96" y1="80" x2="104" y2="80" stroke="#2dd4bf" stroke-width="2.5" />

  <!-- Body / Shoulders -->
  <path d="M44 175 C44 135, 70 125, 100 125 C130 125, 156 135, 156 175 Z" fill="#1e293b" />
  <path d="M50 175 C50 140, 74 132, 100 132 C126 132, 150 140, 150 175 Z" fill="#334155" />

  <!-- Collar / Hoodie V -->
  <path d="M88 132 L100 152 L112 132 Z" fill="#0d9488" opacity="0.9" />

  <!-- Data / Neural Network Nodes Motif -->
  <circle cx="35" cy="50" r="3" fill="#2dd4bf" opacity="0.7" />
  <circle cx="165" cy="50" r="3" fill="#2dd4bf" opacity="0.7" />
  <circle cx="160" cy="140" r="2.5" fill="#2dd4bf" opacity="0.5" />
  <line x1="35" y1="50" x2="55" y2="65" stroke="#2dd4bf" stroke-width="1" opacity="0.4" />
  <line x1="165" y1="50" x2="145" y2="65" stroke="#2dd4bf" stroke-width="1" opacity="0.4" />

  <!-- Monogram Initials Tag -->
  <rect x="76" y="158" width="48" height="20" rx="10" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5" />
  <text x="100" y="172" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#2dd4bf" text-anchor="middle">CR.DS</text>
</svg>
